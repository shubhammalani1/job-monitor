name: Job Monitor

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      user_id:
        description: "If set, only run for this user (used by on-demand dashboard runs)"
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_USER_ID: ${{ inputs.user_id }}
        run: python src/main.py
