name: Job Monitor

on:
  # Runs every hour as a heartbeat - main.py itself decides whether this hour
  # actually matches the configured run_times in app_settings, or whether the
  # pipeline is paused. This is what makes schedule/pause controllable from the
  # dashboard without ever editing this file again.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      user_id:
        description: "If set, only run for this user (used by on-demand dashboard runs)"
        required: false
        type: string
      phrase_ids:
        description: "Comma-separated search_phrases ids to restrict this run to (optional)"
        required: false
        type: string
      company_ids:
        description: "Comma-separated companies ids to restrict this run to (optional)"
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_USER_ID: ${{ inputs.user_id }}
          TARGET_PHRASE_IDS: ${{ inputs.phrase_ids }}
          TARGET_COMPANY_IDS: ${{ inputs.company_ids }}
        run: python src/main.py
